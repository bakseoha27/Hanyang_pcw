<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>신규입사자 서류 관리 · 한양 pcw팀</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.v2.css">
<style>
  body{background:#EEF2F8;}
  .login-wrap{max-width:430px;margin:0 auto;padding:26px 16px 40px;min-height:100vh;}
  .login-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:22px 18px 18px;}
  .login-card .ic{width:52px;height:52px;border-radius:16px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px;}
  .login-card h1{margin:0 0 6px;font-size:19px;font-weight:900;letter-spacing:-.5px;}
  .login-card p{margin:0 0 18px;font-size:12.5px;color:var(--gray);line-height:1.55;}
  .login-card .err{margin:0 0 12px;padding:10px 12px;border-radius:11px;background:var(--red-soft);color:#B42318;font-size:12.5px;font-weight:800;display:none;}
  .login-card .err.on{display:block;}
  .foot{margin-top:14px;text-align:center;font-size:11.5px;color:#98A2B3;line-height:1.6;}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="ic">🔐</div>
    <h1>신규입사자 서류 관리</h1>
    <p>지정된 관리자만 열람할 수 있습니다.<br>이름 · 전화번호 · 관리자 암호를 입력해 주세요.</p>
    <div class="err" id="loginErr"></div>
    <div class="field">
      <label for="an">이름</label>
      <input type="text" id="an" autocomplete="name" placeholder="예) 박서하">
    </div>
    <div class="field">
      <label for="ap">전화번호</label>
      <input type="tel" id="ap" inputmode="numeric" placeholder="010-0000-0000" maxlength="13">
    </div>
    <div class="field">
      <label for="ac">관리자 암호</label>
      <input type="password" id="ac" autocomplete="current-password" placeholder="관리자 암호">
    </div>
    <button class="btn" id="loginBtn" style="margin-top:6px">들어가기</button>
    <p class="foot">제출된 주민등록번호·신분증·건강검진은 지정 관리자만 내려받을 수 있으며,<br>입사 취소 시 파일과 기록을 함께 영구 삭제합니다.</p>
  </div>
</div>

<!-- 관리자 -->
<div id="adminView" class="hide">
  <div class="ahd">
    <b>신규입사자 서류 관리</b>
    <span class="who" id="whoami"></span>
    <button class="btn gray sm" id="logoutBtn" style="width:auto;height:32px;padding:0 12px;font-size:12px;border-radius:9px">나가기</button>
  </div>

  <div class="abody">
    <div class="panel">
      <div class="pb">
        <div class="stat3">
          <div class="s"><small>전체 제출</small><b id="statAll">0</b></div>
          <div class="s"><small>서류 미비</small><b id="statMiss" style="color:#B42318">0</b></div>
          <div class="s"><small>오늘 제출</small><b id="statToday" style="color:#1D4ED8">0</b></div>
        </div>
        <div class="toolbar">
          <button class="btn grow" id="btnExcel">📊 엑셀 취합 다운로드</button>
          <button class="btn grow green" id="btnZip">📦 서류 ZIP 다운로드</button>
          <button class="btn grow gray" id="btnRefresh">🔄 새로고침</button>
          <button class="btn grow red" id="btnDelete">🗑️ 입사취소 삭제</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="ph">
        <b>제출 현황</b>
        <input type="text" id="q" placeholder="이름·연락처·직종 검색" style="flex:1 1 130px;min-width:120px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#475467">
          <input type="checkbox" id="chkAll" style="width:17px;height:17px;accent-color:#2F6BFF"> 전체 선택
        </label>
      </div>
      <div class="pb">
        <div id="listNotice" class="sub" style="margin:0 0 10px;color:#98A2B3;font-size:11.5px">선택한 사람이 없으면 전체 인원으로 처리됩니다. (삭제는 반드시 선택 후)</div>
        <div class="list" id="list"></div>
        <div id="empty" class="hide" style="text-align:center;color:#98A2B3;font-size:13px;padding:28px 0">아직 제출된 서류가 없습니다.</div>
      </div>
    </div>
  </div>
</div>

<!-- 상세 -->
<div class="modal" id="detailModal">
  <div class="bg" data-close></div>
  <div class="sheet">
    <div class="head"><b id="detailTitle">제출 정보</b><button type="button" data-close>✕</button></div>
    <div class="body" id="detailBody"></div>
  </div>
</div>

<div id="toast"></div>

<script src="vendor/exceljs.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="js/config.js"></script>
<script src="js/admin.v2.js"></script>
</body>
</html>
